[tool.ruff]
target-version = "py39"
line-length = 100
include = ["pyproject.toml", "app/**/*.py", "evals/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pyright]
include = ["app", "evals", "tests"]
pythonVersion = "3.9"
typeCheckingMode = "standard"

[tool.pylint.main]
py-version = "3.9"

[tool.pylint.format]
max-line-length = 100
